<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Intelligence Hub - 企业内部系统、工具、网址与智能问答入口。" />
    <meta name="theme-color" content="#0f1f3a" />
    <meta name="application-name" content="Intelligence Hub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Intelligence Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Intelligence Hub</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=20261124_05" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/marked@12.0.0/marked.min.js"></script>
    <script src="https://unpkg.com/dompurify@3.0.9/dist/purify.min.js"></script>
    <script type="module" src="./app.js?v=20261124_05"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-bar"><div class="site-bar-inner">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">
            <img src="./assets/icons/icon-192.png" alt="" />
          </span>
          <div>
            <h1 class="brand-name">Intelligence Hub</h1>
            <div class="brand-subtitle"></div>
          </div>
        </div>
        <div class="account-tools">
          <span class="workspace-date" id="workspaceDate"></span>
          <button type="button" class="daily-photo-display" hidden aria-label="查看今日照片"><img alt="今日照片" loading="lazy" /></button>
          <button class="topbar-icon-btn" id="summaryRefreshBtn" type="button" aria-label="刷新工作台状态" title="刷新今日日程与报销状态"><i data-lucide="refresh-cw"></i></button>
          <div class="account-profile">
            <button id="accountToggle" class="account-toggle" type="button" aria-controls="accountMenu" disabled>
              <span class="account-avatar" id="accountAvatar" aria-hidden="true"><i data-lucide="user-round"></i></span>
              <span id="accountName">访客</span>
            </button>
            <div id="accountMenu" class="account-menu" hidden><a href="/admin">后台管理</a></div>
          </div>
        </div>
      </div></header>

      <main class="workspace">
        <div class="workspace-inner">
          <section class="assistant-home" id="assistantHome" aria-label="智能搜索与对话区">
            <div class="assistant-inline-mount" id="assistantInlineMount"></div>
            <div class="command-match-panel" id="commandMatchPanel" hidden aria-live="polite"></div>
            <div class="assistant-tools">
            <div class="assistant-quick-prompts" id="assistantQuickPrompts" aria-label="常用快捷指令">
              <button class="quick-prompt-chip" type="button" data-quick-prompt="查一下我今天的会议">
                <i data-lucide="calendar"></i><span>查今日会议</span>
              </button>
              <button class="quick-prompt-chip" type="button" data-quick-prompt="今天有哪些空闲会议室">
                <i data-lucide="door-open"></i><span>查空闲会议室</span>
              </button>
              <button class="quick-prompt-chip" type="button" data-quick-prompt="查询我的通讯费报销记录">
                <i data-lucide="receipt"></i><span>查报销记录</span>
              </button>
              <button class="quick-prompt-chip" type="button" data-quick-action="upload-invoice">
                <i data-lucide="upload"></i><span>上传通讯费发票</span>
              </button>
              <button class="quick-prompt-chip" type="button" data-quick-prefill="公司制度里关于">
                <i data-lucide="book-open"></i><span>问公司制度</span>
              </button>
            </div>
              <div class="assistant-widget">
                <button class="quick-prompt-chip" id="assistantToggle" type="button" aria-expanded="false" aria-controls="assistantPanel" aria-label="在浮窗中打开助手">
                  <i data-lucide="panels-top-left"></i><span>助手浮窗</span>
                </button>
              </div>
            </div>
          </section>

          <section class="home-bento" id="homeBentoGrid" aria-label="今日工作台概览">
            <article class="bento-card bento-card-quick" id="bentoQuickCard">
              <div class="bento-card-head">
                <span class="bento-card-title"><i data-lucide="pin"></i>我的常用</span>
                <span class="bento-badge" id="bentoQuickBadge">自动推荐</span>
              </div>
              <div class="bento-quick-grid" id="bentoQuickBody">
                <p class="bento-placeholder">加载常用入口…</p>
              </div>
            </article>

            <article class="bento-card bento-card-meeting" id="bentoMeetingCard">
              <div class="bento-card-head">
                <span class="bento-card-title"><i data-lucide="calendar-clock"></i>今日日程</span>
                <span class="bento-badge" id="bentoMeetingBadge">加载中</span>
              </div>
              <div class="bento-card-body" id="bentoMeetingBody">
                <p class="bento-placeholder">正在同步今天的会议安排…</p>
              </div>
              <div class="bento-card-actions">
                <button class="bento-action-btn" type="button" data-quick-prompt="查一下我今天的会议">查看日程</button>
                <button class="bento-action-btn bento-action-primary" type="button" data-quick-prefill="帮我预定会议：">快速约会</button>
              </div>
            </article>

            <article class="bento-card bento-card-expense" id="bentoExpenseCard">
              <div class="bento-card-head">
                <span class="bento-card-title"><i data-lucide="receipt-text"></i>通讯费报销</span>
                <span class="bento-badge" id="bentoExpenseBadge">加载中</span>
              </div>
              <div class="bento-card-body" id="bentoExpenseBody">
                <p class="bento-placeholder">正在查询前三个月的报销记录…</p>
              </div>
              <div class="bento-card-actions">
                <button class="bento-action-btn" type="button" data-quick-prompt="查询我的通讯费报销记录">历史记录</button>
                <button class="bento-action-btn bento-action-primary" type="button" data-quick-action="upload-invoice">上传发票</button>
              </div>
            </article>

          </section>

          <div class="catalog-toolbar" id="catalogToolbar">
            <h2>应用目录</h2>
            <div class="catalog-toolbar-right">
              <div class="density-switch" role="group" aria-label="卡片显示密度">
                <button class="density-btn active" type="button" data-density="compact" title="紧凑磁贴视图">
                  <i data-lucide="layout-grid"></i><span>紧凑</span>
                </button>
                <button class="density-btn" type="button" data-density="comfortable" title="舒适详情视图">
                  <i data-lucide="rows-3"></i><span>舒适</span>
                </button>
              </div>
            </div>
          </div>
          <div class="catalog-tabs" id="catalogTabs" role="group" aria-label="入口分类筛选"></div>

          <section class="catalog-area" id="catalogArea" aria-live="polite"></section>
        </div>
      </main>
    </div>

      <aside class="assistant-panel" id="assistantPanel" aria-hidden="true">
        <input type="file" id="nativeInvoiceUpload" accept="image/*,application/pdf" multiple style="display:none" />

        <button class="assistant-resize-handle" id="assistantResizeHandle" type="button" aria-label="拖动调整助手窗口大小；也可使用方向键" title="拖动或使用方向键调整窗口大小">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
          </svg>
        </button>
        
        <button class="assistant-close floating-close" id="assistantClose" type="button" aria-label="关闭问答">×</button>
        <div class="assistant-history-toolbar" aria-label="对话记录">
          <button class="assistant-history-state" id="assistantHistoryToggle" type="button" aria-expanded="false" aria-controls="assistantHistoryDrawer">
            <i data-lucide="history"></i><span id="assistantSessionLabel">今天 · 自动保存</span><i class="assistant-history-chevron" data-lucide="chevron-down"></i>
          </button>
          <button class="assistant-new-chat" id="assistantNewChat" type="button" aria-label="新建对话" title="新建对话">
            <i data-lucide="square-pen"></i><span>新对话</span>
          </button>
          <button class="assistant-clear" id="assistantClear" type="button" aria-label="删除当前对话" title="删除当前对话">
            <i data-lucide="trash-2"></i><span>删除</span>
          </button>
        </div>
        <div class="assistant-history-layer" id="assistantHistoryLayer" aria-hidden="true">
          <button class="assistant-history-backdrop" id="assistantHistoryBackdrop" type="button" aria-label="关闭对话记录"></button>
          <section class="assistant-history-drawer" id="assistantHistoryDrawer" aria-label="已保存的对话">
            <header class="assistant-history-header">
              <div>
                <p>本机保存</p>
                <h3>对话记录</h3>
              </div>
              <button id="assistantHistoryClose" type="button" aria-label="关闭对话记录">×</button>
            </header>
            <div class="assistant-session-list" id="assistantSessionList"></div>
            <footer class="assistant-history-footer">
              <button id="assistantClearAll" type="button"><i data-lucide="trash-2"></i>清除全部记录</button>
              <p>记录仅保存在当前浏览器</p>
            </footer>
          </section>
        </div>
        <div class="assistant-chat-container">
          <div class="assistant-messages" id="assistantMessages">
            <div class="assistant-message assistant-message-system">
              <div class="assistant-message-content">
                你好！我是 AI 助手，有什么我可以帮您的吗？
              </div>
            </div>
          </div>
          <div class="assistant-input-area">
            <!-- Attachment preview pool -->
            <div class="assistant-attachment-pool" id="assistantAttachmentPool" style="display:none;"></div>
            
            <div class="assistant-input-wrapper">
              <span class="command-search-icon" aria-hidden="true"><i data-lucide="search"></i></span>
              <button class="native-upload-btn" id="nativeUploadBtn" type="button" aria-label="通讯费报销">
                通讯费报销
              </button>
              <textarea id="assistantInput" aria-label="搜入口或问助手" placeholder="搜系统入口，或问助手…" rows="1"></textarea>
              <kbd id="commandShortcutHint" aria-hidden="true">⌘K</kbd>
              <input id="difyAttachmentInput" type="file" accept="image/*,application/pdf" multiple style="display:none;" />
              <button id="difyAttachmentBtn" class="assistant-mic-btn" type="button" aria-label="上传发票附件">
                <i data-lucide="paperclip"></i>
              </button>
              <button id="assistantMicBtn" class="assistant-mic-btn" type="button" aria-label="语音输入">
                <i data-lucide="mic"></i>
              </button>
              <button id="assistantSendBtn" type="button" aria-label="发送">
                <svg class="assistant-send-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M22 2 11 13"></path>
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                </svg>
              </button>
            </div>
            <div class="assistant-footer">POWERED BY Intelligence Hub</div>
          </div>
        </div>
      </aside>
    <section class="photo-viewer" id="photoViewer" aria-hidden="true">
      <div class="photo-viewer-overlay" id="photoViewerOverlay"></div>
      <div class="photo-viewer-content">
        <img alt="今日照片全屏" id="photoViewerImg" />
        <button class="photo-viewer-close" id="photoViewerClose" type="button" aria-label="关闭预览">×</button>
      </div>
    </section>

    <!-- Invoice Result Modal -->
    <div class="invoice-modal-overlay" id="invoiceResultModal" aria-hidden="true">
      <div class="invoice-modal-content">
        <div class="invoice-modal-header">
          <h3 id="invoiceModalTitle">发票识别结果</h3>
          <button class="invoice-modal-close" id="invoiceModalClose">&times;</button>
        </div>
        <div class="invoice-modal-body" id="invoiceModalBody">
          <!-- Dynamically filled -->
        </div>
        <div class="invoice-modal-footer" id="invoiceModalFooter">
          <!-- Dynamically filled -->
        </div>
      </div>
    </div>
  </body>
</html>
